<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a5f4a" />
  <meta name="description" content="책나무어휘 골든벨·사전 모바일 CBT" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="책나무CBT" />
  <title>책나무어휘 CBT</title>
  <link rel="manifest" href="manifest.webmanifest?v=4" />
  <link rel="icon" href="icons/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/android-icon-192x192.png?v=4" />
  <link rel="apple-touch-icon" href="icons/apple-icon.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png?v=4" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-icon-152x152.png?v=4" />
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-icon-120x120.png?v=4" />
  <meta name="msapplication-TileColor" content="#1a5f4a" />
  <meta name="msapplication-TileImage" content="icons/ms-icon-144x144.png?v=4" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen active">
      <div class="start-inner">
        <p class="eyebrow">책나무어휘</p>
        <h1>모바일 CBT</h1>
        <p class="start-desc">풀고 싶은 시험을 골라 주세요.</p>
        <div id="quiz-list" class="quiz-list"></div>
      </div>
    </section>

    <section id="screen-start" class="screen">
      <div class="start-inner">
        <button type="button" id="btn-back-home" class="link-back">← 시험 선택</button>
        <p class="eyebrow" id="start-eyebrow">중학교 1학년 1학기</p>
        <h1 id="start-title">책나무어휘<br />골든벨</h1>
        <p class="start-desc" id="start-desc">한 화면에 한 문제씩 풀어 보세요.</p>
        <label class="field">
          <span>이름</span>
          <input id="name-input" type="text" maxlength="20" placeholder="이름을 입력하세요" autocomplete="name" />
        </label>
        <button type="button" id="btn-start" class="btn btn-primary">시작하기</button>
        <button type="button" id="btn-resume" class="btn btn-ghost hidden">이어서 풀기</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen">
      <header class="quiz-header">
        <div class="progress-meta">
          <span id="progress-label">1 / 45</span>
          <span id="quiz-name" class="quiz-name"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </header>
      <main id="question-area" class="question-area"></main>
      <div id="check-feedback" class="check-feedback hidden" role="status" aria-live="polite"></div>
      <footer class="quiz-nav">
        <button type="button" id="btn-prev" class="btn btn-secondary">이전</button>
        <button type="button" id="btn-check" class="btn btn-check">정답확인</button>
        <button type="button" id="btn-next" class="btn btn-primary">다음</button>
      </footer>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-inner">
        <h1>결과</h1>
        <p id="result-summary" class="result-summary"></p>
        <div id="result-list" class="result-list"></div>
        <button type="button" id="btn-restart" class="btn btn-primary">다시 풀기</button>
        <button type="button" id="btn-home" class="btn btn-ghost">다른 시험 선택</button>
      </div>
    </section>
  </div>

  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
