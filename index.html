<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173b53" />
  <meta name="description" content="호호 스터디 — 국어 어휘와 영어 단어·본문을 한 문제씩 공부하세요." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="호호 스터디" />
  <title>호호 스터디</title>
  <link rel="manifest" href="manifest.webmanifest?v=15" />
  <link rel="icon" href="icons/hoho.ico?v=15" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/hoho-32.png?v=15" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/hoho-192.png?v=15" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/hoho-180.png?v=15" />
  <meta name="msapplication-TileColor" content="#173b53" />
  <meta name="msapplication-TileImage" content="icons/hoho-144.png?v=15" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen active">
      <div class="start-inner home-inner">
        <header class="home-brand">
          <img src="icons/hoho-192.png?v=15" width="52" height="52" alt="" />
          <div><h1>호호 스터디</h1><p>원하는 학습을 골라 시작하세요.</p></div>
        </header>
        <div class="profile-row">
          <span id="profile-name">이름은 첫 학습 때 한 번만 입력해 주세요.</span>
          <button type="button" id="btn-edit-name" class="link-back hidden">이름 변경</button>
        </div>
        <form id="profile-editor" class="profile-editor hidden">
          <label class="field"><span>사용할 이름</span><input id="profile-name-input" type="text" maxlength="20" autocomplete="name" required /></label>
          <div><button type="submit" class="btn btn-primary">저장</button> <button type="button" id="btn-cancel-name" class="btn btn-secondary">취소</button></div>
        </form>
        <section class="study-library" aria-labelledby="library-title">
          <div class="library-heading"><h2 id="library-title">학습 목록</h2><span id="quiz-list-status" role="status" aria-live="polite"></span></div>
          <label class="quiz-search-label">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="quiz-search" type="search" aria-label="학습 목록 검색" placeholder="학습 이름 또는 Lesson 검색" autocomplete="off" />
          </label>
          <div id="subject-filters" class="subject-filters" role="group" aria-label="과목 선택"></div>
          <div id="quiz-list" class="quiz-list"></div>
        </section>
        <div id="android-update" class="app-update-row hidden">
          <span id="android-version"></span>
          <button type="button" id="btn-app-update" class="btn btn-ghost">업데이트 확인</button>
        </div>
      </div>
    </section>

    <section id="screen-start" class="screen">
      <div class="start-inner">
        <button type="button" id="btn-back-home" class="link-back">← 시험 선택</button>
        <p class="eyebrow" id="start-eyebrow">중학교 1학년 1학기</p>
        <h1 id="start-title">어휘 골든벨</h1>
        <p class="start-desc" id="start-desc">한 화면에 한 문제씩 풀어 보세요.</p>
        <p id="quiz-notice" class="quiz-notice hidden"></p>
        <fieldset id="lesson-picker" class="lesson-picker hidden">
          <legend>출제할 Lesson 선택</legend>
          <div id="lesson-options" class="lesson-options"></div>
          <p id="lesson-count" class="lesson-count"></p>
        </fieldset>
        <fieldset id="order-picker" class="lesson-picker hidden">
          <legend>출제 순서</legend>
          <div class="lesson-options">
            <label class="lesson-option"><input type="radio" name="question-order" value="source" checked /><span>본문 순서</span></label>
            <label class="lesson-option"><input type="radio" name="question-order" value="random" /><span>무작위</span></label>
          </div>
        </fieldset>
        <label class="field" id="name-field">
          <span>이름</span>
          <input id="name-input" type="text" maxlength="20" placeholder="이름을 입력하세요" autocomplete="name" />
        </label>
        <button type="button" id="btn-start" class="btn btn-primary">시작하기</button>
        <button type="button" id="btn-resume" class="btn btn-ghost hidden">이어서 풀기</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen">
      <header class="quiz-header">
        <div class="progress-meta">
          <span id="progress-label">1 / 45</span>
          <span id="quiz-name" class="quiz-name"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </header>
      <main id="question-area" class="question-area"></main>
      <div id="check-feedback" class="check-feedback hidden" role="status" aria-live="polite"></div>
      <footer class="quiz-nav">
        <button type="button" id="btn-prev" class="btn btn-secondary">이전</button>
        <button type="button" id="btn-check" class="btn btn-check">정답확인</button>
        <button type="button" id="btn-next" class="btn btn-primary">다음</button>
      </footer>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-inner">
        <h1>결과</h1>
        <p id="result-summary" class="result-summary"></p>
        <div id="result-list" class="result-list"></div>
        <button type="button" id="btn-restart" class="btn btn-primary">다시 풀기</button>
        <button type="button" id="btn-home" class="btn btn-ghost">다른 시험 선택</button>
      </div>
    </section>
  </div>

  <script src="js/cloze.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.hostname !== "appassets.androidplatform.net") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
